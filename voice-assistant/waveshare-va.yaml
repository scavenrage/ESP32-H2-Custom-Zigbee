# Satellite vocale Home Assistant su Waveshare ESP32-S3-AUDIO-Board.
# Basato su https://github.com/jnix85/esphome-waveshare-esp32-s3-audio-va (core pinnato a v1.1.0).
# Uso: copia secrets.example.yaml in secrets.yaml, compila i valori, poi
#   esphome run waveshare-va.yaml
# (oppure incolla questo file nell'add-on ESPHome Device Builder di HA).

substitutions:
  name: argo-salotto            # cambia per la seconda scheda (es. argo-camera)
  friendly_name: "Argo Salotto"
  posix_timezone: "CET-1CEST,M3.5.0,M10.5.0/3"   # Europe/Rome
  volume_min: '0.4'
  volume_max: '0.8'
  hidden_ssid: 'false'

packages:
  core:
    url: https://github.com/jnix85/esphome-waveshare-esp32-s3-audio-va
    ref: v1.1.0
    files:
      - base/core.yaml
    refresh: 1d

# Aggiunge "Hey Jarvis" ai modelli del core (alexa, okay_nabu). Dopo il flash la
# wake word attiva si sceglie dall'entita' "Wake word" del dispositivo in HA.
micro_wake_word:
  models:
    - model: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/hey_jarvis.json
      id: hey_jarvis
